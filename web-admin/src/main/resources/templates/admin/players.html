<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('ค้นหาผู้เล่น', ~{::content})}" lang="th">
<body>
<div th:fragment="content" th:remove="tag">
    <h1>ผู้เล่น</h1>
    <div class="card">
        <form method="get" th:action="@{/admin/players}">
            <label>ชื่อตัวละคร</label>
            <input name="q" th:value="${q}">
            <button type="submit">ค้นหา</button>
        </form>
    </div>

    <div class="card">
        <p class="muted" th:if="${results.isEmpty()}">ไม่พบผู้เล่น</p>
        <table th:if="${!results.isEmpty()}">
            <tr><th>ตัวละคร</th><th>เลเวล</th><th>เงิน</th><th>บัญชี</th><th>สถานะ</th></tr>
            <tr th:each="p : ${results}">
                <td><a th:href="@{'/admin/player/' + ${p.id}}" th:text="${p.name}"></a></td>
                <td th:text="${p.level}"></td>
                <td th:text="${p.gold}"></td>
                <td th:text="${p.account != null ? p.account.username : '-'}"></td>
                <td>
                    <span class="badge"
                          th:with="t=${p.account != null ? tierByAccount.get(p.account.id) : null}"
                          th:if="${t != null and t.name() != 'NORMAL'}"
                          th:classappend="${t.banned} ? 'banned' : 'gm'"
                          th:text="${t.label}"></span>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
