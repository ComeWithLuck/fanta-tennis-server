spring.datasource.url=jdbc:mysql://localhost:3306/fantasytennis?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Berlin
spring.datasource.username=jftse
spring.datasource.password=jftse
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
spring.jpa.open-in-view=true

server.port=8080
spring.thymeleaf.cache=false
spring.web.resources.add-mappings=true

# the site never talks to RabbitMQ; it only reads/writes the same database the servers use
jftse.rabbitmq.enabled=false
jftse.rabbitmq.metrics.enabled=false

# our own tables (web_account_role): created on startup, never touches the emulator's schema
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
